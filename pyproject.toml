[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mergelens"
version = "0.1.0.dev0"
description = "Git-native merge conflict advisor. Advisory only — Git stays the source of truth."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MergeLens" }]
keywords = ["git", "merge", "conflict", "backport", "cherry-pick"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control :: Git",
]

dependencies = [
  "typer>=0.12.0",
  "rich>=13.7",
  "pydantic>=2.7",
]

[project.optional-dependencies]
ui = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
]
ai = [
  "httpx>=0.27",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "httpx>=0.27",
]
all = ["mergelens[ui,ai]"]

[project.scripts]
mergelens = "mergelens.cli.main:app"

[project.urls]
Homepage = "https://github.com/your-org/mergelens"

[tool.hatch.build.targets.wheel]
packages = ["src/mergelens"]
artifacts = ["src/mergelens/server/static/**"]   # populated by scripts/build_web.py (step 8)

[tool.hatch.build.targets.sdist]
include = ["src/mergelens", "pyproject.toml", "README.md"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
packages = ["mergelens"]
strict = true
